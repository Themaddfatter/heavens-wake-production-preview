name: Publish and verify HWP production

on:
  push:
    branches: [main]
    paths:
      - index.html
      - hwp-style.css
      - hwp-logo.png
      - hwp-bibles/**
      - CNAME
      - .nojekyll
      - .github/workflows/verify-hwp-production.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hwp-github-pages-production
  cancel-in-progress: false

jobs:
  publish-hwp:
    name: Publish and verify production.sioncdo.com
    runs-on: [self-hosted, Linux, X64, hwp-wsl]
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out HWP source
        uses: actions/checkout@v4

      - name: Prepare HWP static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_output/hwp-bibles
          cp index.html hwp-style.css hwp-logo.png CNAME .nojekyll _pages_output/
          cp hwp-bibles/*.js _pages_output/hwp-bibles/
          test -s _pages_output/index.html
          grep -Fq 'HWP: presentation appearance boundary.' _pages_output/hwp-style.css
          grep -Fq -- '--text:#f3f1ec' _pages_output/hwp-style.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HWP website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_output

      - name: Deploy HWP to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HWP theme isolation
        shell: bash
        run: |
          set -euo pipefail
          domain="https://production.sioncdo.com"
          verified=0
          for attempt in $(seq 1 20); do
            echo "Checking production attempt ${attempt}/20"
            if curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" "$domain/?hwp_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-home.html" \
              && curl --fail --silent --show-error --location --max-time 25 -H "Cache-Control: no-cache" "$domain/hwp-style.css?hwp_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-style.css" \
              && grep -Fq "hwp-style.css" "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq "HWP: presentation appearance boundary." "$RUNNER_TEMP/hwp-style.css" \
              && grep -Fq -- "--text:#f3f1ec" "$RUNNER_TEMP/hwp-style.css"; then
                echo "VERIFIED: HWP theme isolation is live at $domain"
                verified=1
                break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 12; fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::HWP production could not be verified. Confirm GitHub Pages custom domain and DNS."
            exit 1
          fi
