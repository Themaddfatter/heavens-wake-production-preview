name: Verify HWP production theme fix

on:
  push:
    branches: [main]
    paths:
      - index.html
      - hwp-style.css
      - .github/workflows/verify-hwp-production.yml
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production checks when multiple commits land together.
concurrency:
  group: verify-hwp-production
  cancel-in-progress: true

jobs:
  verify-hwp-production:
    name: Verify production.sioncdo.com
    runs-on: [self-hosted, Linux, X64, hwp-wsl]
    timeout-minutes: 10
    steps:
      - name: Check deployed presentation theme isolation
        shell: bash
        run: |
          set -euo pipefail
          domain="https://production.sioncdo.com"
          verified=0

          for attempt in $(seq 1 20); do
            echo "Checking production attempt ${attempt}/20"
            if curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "$domain/?hwp_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-home.html" \
              && curl --fail --silent --show-error --location --max-time 25 \
                -H 'Cache-Control: no-cache' \
                "$domain/hwp-style.css?hwp_verify=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-style.css" \
              && grep -Fq 'hwp-style.css' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'HWP: presentation appearance boundary.' "$RUNNER_TEMP/hwp-style.css" \
              && grep -Fq -- '--text:#f3f1ec' "$RUNNER_TEMP/hwp-style.css"; then
                echo "VERIFIED: HWP presentation theme isolation is live at $domain"
                verified=1
                break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 12; fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "::error::HWP production has not yet served the theme-isolation CSS."
            exit 1
          fi
