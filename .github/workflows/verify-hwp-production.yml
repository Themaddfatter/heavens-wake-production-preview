name: Verify published HWP site (no deployment)
run-name: HWP browser release checks - ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - index.html
      - hwp-style.css
      - hwp-access.css
      - hwp-mobile-companion.css
      - hwp-update-notice.js
      - hwp-update-notice.css
      - hwp.webmanifest
      - scripts/hwp-branding.py
      - 'hwp-*-white.png'
      - hwp-logo.png
      - hwp-font-catalog.json
      - hwp-bibles/**
      - sync-staging/**
      - song-creator/**
      - tests/**
      - .github/workflows/verify-hwp-production.yml
  workflow_dispatch:

# Pages deployment is owned by GitHub's built-in "pages build and deployment".
# Do not call deploy-pages, configure-pages or upload-pages-artifact here.
permissions:
  contents: read

jobs:
  verify-hwp:
    name: Test HWP source and verify live Bible release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out HWP source
        uses: actions/checkout@v4

      - name: Generate official opaque white HWP icons
        run: |
          python -m pip install --quiet Pillow
          python scripts/hwp-branding.py

      - name: Verify public Ministry Connect configuration and CORS
        shell: bash
        run: |
          set -euo pipefail
          origin="https://production.sioncdo.com"
          endpoint="https://us-central1-sion-schedule-next.cloudfunctions.net"
          curl -fsS --max-time 25 -H "Origin: $origin" -D "$RUNNER_TEMP/hwp-config-headers" "$endpoint/hwpFirebaseConfig" -o "$RUNNER_TEMP/hwp-config.json"
          grep -iF "access-control-allow-origin: $origin" "$RUNNER_TEMP/hwp-config-headers"
          node -e 'const c=JSON.parse(require("node:fs").readFileSync(process.argv[1]));if(c.projectId!=="sion-schedule-next"||!c.apiKey||!c.appId||!c.authDomain)process.exit(1);console.log("Verified public HWP Firebase config and origin");console.log("HWP_PUBLIC_WEB_CONFIG="+JSON.stringify({apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,appId:c.appId,messagingSenderId:c.messagingSenderId||""}))' "$RUNNER_TEMP/hwp-config.json"
          curl -fsS --max-time 20 -X OPTIONS -H "Origin: $origin" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" -D "$RUNNER_TEMP/hwp-workspace-headers" "$endpoint/hwpWorkspace" -o /dev/null
          grep -iF "access-control-allow-origin: $origin" "$RUNNER_TEMP/hwp-workspace-headers"

      - name: Verify all inline application JavaScript parses
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          let checked=0;
          for(const match of scripts){
            if(!match[1].trim())continue;
            new vm.Script(match[1],{filename:'index-inline-'+checked+'.js'});
            checked++;
          }
          if(checked<3)throw Error('Missing HWP application scripts');
          console.log('Compiled '+checked+' inline JavaScript blocks');
          NODE

      - name: Run Bible and local media regression tests
        run: node --test tests/hwp-mobile-companion.test.mjs tests/hwp-sermon-control.test.mjs tests/hwp-mixer-cursor.test.mjs tests/hwp-service-medleys.test.mjs tests/hwp-bible-presentations.test.mjs tests/hwp-song-labels.test.mjs tests/hwp-stage-media-controls.test.mjs sync-staging/hwp-local-media-sync.test.mjs sync-staging/hwp-cloud-media.test.mjs sync-staging/hwp-recovery.test.mjs

      - name: Confirm live HWP Bible and service medley release
        shell: bash
        run: |
          set -euo pipefail
          domain="https://production.sioncdo.com"
          for attempt in $(seq 1 25); do
            echo "Checking HWP production content $attempt/25"
            if curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" \
                "$domain/?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-home.html" \
              && curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" \
                "$domain/hwp-access.css?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-access.css" \
              && curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" \
                "$domain/hwp-logo.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-logo.png" \
              && grep -Fq 'name="hwp-release" content="hwp-media-deletion-safety-v1"' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'name="hwp-output-text-release" content="hwp-output-text-styles-v5"' "$RUNNER_TEMP/hwp-home.html" \
              && curl --fail --silent --show-error --location --max-time 20 "$domain/hwp-font-catalog.json?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-font-catalog.json" \
              && node -e 'const f=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).fonts;if(f.length<1000||new Set(f.map(x=>x.family)).size!==f.length)process.exit(1);console.log("Live font families:",f.length)' "$RUNNER_TEMP/hwp-font-catalog.json" \
              && grep -Fq '+ Create Template' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpMediaFolderEdit' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpLibraryFolderEdit' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpLoadBibleFile' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-fixed-header-v1' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpSermonManifest' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function HwpWorshipControlAgent' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'worshipControlAck' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpUnmergeServiceScriptures' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpRegisteredLabel' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-presentation-note-toggle' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-medley-join-target' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq 'function hwpMedleyDragDetach' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'Medley glow color' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-medley-detach-ready' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq '.hwp-medley-frame' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq 'hwpPresentationView' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function HwpAccessGate' "$RUNNER_TEMP/hwp-home.html" \
                            && grep -Fq 'function HwpBibleInlineTranslationPicker' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'Number of Bible translations' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpBibleDisplaySlide' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq '.bible-side .hwp-bible-inline-versions' "$RUNNER_TEMP/hwp-access.css" \
                            && grep -Fq 'function hwpServiceCreateMedley' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwpServiceMedleyTitle(item,presentation,pl?.items)' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwpServiceZone(item)' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpSongLabelGroups' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'async function saveSongLabel(input)' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'action:"saveSongLabel"' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq '.service-presentation.service-medley-child' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq '.all-service-presentation.service-medley-child > h3.all-pres-bar' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq 'function hwpBibleTranslationBadge' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpScriptureTranslationStart' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-scripture-translation-divider' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq 'deletedMediaIds:' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'engine.current.recoverMedia(remote.workspace,[currentDoc],remote.revision)' "$RUNNER_TEMP/hwp-home.html" \
              && curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" \
                "$domain/sync-staging/sync-core.mjs?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-sync-core.mjs" \
              && curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" \
                "$domain/sync-staging/hwp-firebase-media-remote.mjs?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-firebase-media-remote.mjs" \
              && grep -Fq 'const deletedIds = new Set(' "$RUNNER_TEMP/hwp-sync-core.mjs" \
              && grep -Fq 'user.emailVerified===false' "$RUNNER_TEMP/hwp-firebase-media-remote.mjs" \
              && grep -Fq 'function HwpCloudIndicator' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'hwp-cloud-panel-backdrop' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq 'function HwpStageMessageComposer' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function HwpStageFlash' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpStagePlain' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'case"hwp-prepare-background-labels"' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'Video Background' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'Photo Background' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpFastResolve' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'let hwpMediaClipboard' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'title:`SM OFF`' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'title:`SM ON`' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpOutputWithoutTranslationTag' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function HwpServiceThemeSettings' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq 'function hwpApplyServiceThemeToPlaylist' "$RUNNER_TEMP/hwp-home.html" \
              && grep -Fq '.preview.hwp-preview-redesign .program-frame' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq '.stage-layout .hwp-stage-flash' "$RUNNER_TEMP/hwp-access.css" \
              && grep -Fq '.hwp-service-theme-editor .hwp-theme-header-row' "$RUNNER_TEMP/hwp-access.css" \
              && curl --fail --silent --show-error --location --max-time 20 -H "Cache-Control: no-cache" "$domain/sync-staging/hwp-auth.mjs?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-auth.mjs" \
              && cmp -s sync-staging/hwp-auth.mjs "$RUNNER_TEMP/hwp-auth.mjs" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/sync-staging/hwp-mobile-companion.mjs?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-mobile-companion.mjs" \
              && cmp -s sync-staging/hwp-mobile-companion.mjs "$RUNNER_TEMP/hwp-mobile-companion.mjs" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-mobile-companion.css?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-mobile-companion.css" \
              && cmp -s hwp-mobile-companion.css "$RUNNER_TEMP/hwp-mobile-companion.css" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-update-notice.js?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-update-notice.js" \
              && cmp -s hwp-update-notice.js "$RUNNER_TEMP/hwp-update-notice.js" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-update-notice.css?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-update-notice.css" \
              && cmp -s hwp-update-notice.css "$RUNNER_TEMP/hwp-update-notice.css" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp.webmanifest?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp.webmanifest" \
              && cmp -s hwp.webmanifest "$RUNNER_TEMP/hwp.webmanifest" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-favicon-48-white.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-favicon-48-white.png" \
              && cmp -s hwp-favicon-48-white.png "$RUNNER_TEMP/hwp-favicon-48-white.png" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-touch-180-white.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-touch-180-white.png" \
              && cmp -s hwp-touch-180-white.png "$RUNNER_TEMP/hwp-touch-180-white.png" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-icon-192-white.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-icon-192-white.png" \
              && cmp -s hwp-icon-192-white.png "$RUNNER_TEMP/hwp-icon-192-white.png" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-icon-512-white.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-icon-512-white.png" \
              && cmp -s hwp-icon-512-white.png "$RUNNER_TEMP/hwp-icon-512-white.png" \
              && curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "$domain/hwp-maskable-512-white.png?hwp_release=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-maskable-512-white.png" \
              && cmp -s hwp-maskable-512-white.png "$RUNNER_TEMP/hwp-maskable-512-white.png" \
              && cmp -s index.html "$RUNNER_TEMP/hwp-home.html" \
              && cmp -s hwp-access.css "$RUNNER_TEMP/hwp-access.css" \
              && test -s "$RUNNER_TEMP/hwp-logo.png"; then
                echo "Verified exact current HWP application and stylesheet are published to $domain"
                exit 0
            fi
            if [ "$attempt" -lt 25 ]; then sleep 12; fi
          done
          echo "::error::HWP custom domain is missing the current service medley and Bible release."
          exit 1

      - name: Verify native song creator theme is deployed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'background:var(--bg-3);color:var(--text)' song-creator/editor.css
          grep -Fq ':root[data-hwp-appearance="light"] .hwp-song-dialog{background:#fff;color:var(--text)' song-creator/editor.css
          for attempt in $(seq 1 25); do
            if curl -fsSL --max-time 20 "https://production.sioncdo.com/?song_theme=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-song-theme-home.html" && grep -Fq 'song-creator/editor.css?v=theme-v2' "$RUNNER_TEMP/hwp-song-theme-home.html" && curl -fsSL --max-time 20 "https://production.sioncdo.com/song-creator/editor.css?v=theme-v2&sha=$GITHUB_SHA" -o "$RUNNER_TEMP/hwp-song-theme.css" && cmp -s song-creator/editor.css "$RUNNER_TEMP/hwp-song-theme.css"; then
              echo "Verified deployed song creator theme stylesheet"; exit 0
            fi
            sleep 8
          done
          exit 1
