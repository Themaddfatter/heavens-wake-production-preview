name: Validate hosted HWP streaming relay
on:
  push:
    branches: [codex/hwp-multistream-prototype]
    paths:
      - 'livestream-cloud/**'
      - 'livestream-relay/**'
      - '.github/workflows/validate-livestream-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r livestream-cloud/requirements.txt
      - run: python -m unittest discover -s livestream-cloud -v
      - run: python -m compileall -q livestream-cloud
      - run: node --test livestream-relay/client.test.mjs
      - run: docker build -t hwp-relay-test livestream-cloud
