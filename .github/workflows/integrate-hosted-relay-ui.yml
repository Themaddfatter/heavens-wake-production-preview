name: Integrate hosted relay UI on prototype
on:
  push:
    branches: [codex/hwp-multistream-prototype]
    paths: ['.github/workflows/integrate-hosted-relay-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hwp-hosted-relay-ui-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hwp-multistream-prototype
          fetch-depth: 0
      - name: Preserve newer main changes and integrate hosted browser controls
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          node livestream-cloud/integrate-ui.mjs
          node --check livestream-cloud/client.mjs
          node --check livestream-cloud/controls.mjs
          python - <<'PY'
          import re,pathlib,subprocess,tempfile
          html=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*type=["\']module["\'][^>]*>(.*?)</script>',html,re.S)
          scripts=[s for s in scripts if s.strip()]
          assert scripts, 'Inline module not found'
          with tempfile.TemporaryDirectory() as d:
              for i,s in enumerate(scripts):
                  p=pathlib.Path(d)/f'{i}.mjs'
                  p.write_text(s)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Integrate browser-only HWP hosted relay controls"; fi
          git push origin HEAD:refs/heads/codex/hwp-multistream-prototype
